name: Translate Docs

on:
  push:
    branches: [dev]
    paths:
      - 'apps/docs/content/docs/**'
      - '!apps/docs/content/docs/**/*.zh-TW.*'
      - '!apps/docs/content/docs/**/*.ja.*'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    if: github.repository == 'fuma-nama/fumadocs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      # the builds of UI packages compile their translations with `packages/shared`
      - name: Install Dependencies
        run: pnpm i --frozen-lockfile --filter docs... --filter shared

      - name: Build packages
        run: pnpm run build --filter=@fumadocs/satteri

      - name: Translate
        working-directory: apps/docs
        run: pnpm translate
        env:
          GT_API_KEY: ${{ secrets.GT_API_KEY }}

      # the files that failed are translated again in the next run
      - name: Open Pull Request
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/translations
          title: 'docs: update translations'
          commit-message: 'docs: update translations'
          body: Translations of the docs changed on `dev`, generated by `pnpm translate` in `apps/docs`.
          add-paths: |
            apps/docs/content/docs
            apps/docs/translations.lock.json
