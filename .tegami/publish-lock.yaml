core:changelogs:
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n  \"@fumadocs/graphql\":\n    type: patch\n---\n\n### Load documents once\n\n- `includeDocument: false` of `createOpenAPI()` and `createAsyncAPI()` leaves documents out of page props, pages load each one once per browser session with `loadDocument` of `createOpenAPIPage()` and `createAsyncAPIPage()`.\n- Same for GraphQL schemas: `includeSchema: false` of `createGraphQL()` with `loadSchema` of `createGraphQLPage()`.\n"
    filename: 2026-10-20-load-documents-once.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: patch\n---\n\n### Turbopack loader warnings\n\n- Next.js 16.4 builds no longer warn `Module not found: Can't resolve <dynamic>` for the config imports of the loaders.\n"
    filename: 2026-10-20-mdx-turbopack-loader-warnings.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-preview:\n    type: patch\n---\n\n### AI chat prompt as `instructions`\n\nPass the AI chat system prompt as `instructions`, replacing the `system` option deprecated in AI SDK 7.\n"
    filename: 2026-10-18-preview-ai-instructions.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-twoslash:\n    type: patch\n---\n\n### Hover signatures of repeated calls\n\nHovering a call shows that call's own resolved signature again. Repeated calls of the same function, such as two `z.enum([...])` calls with different values, all showed the first call's signature, since the hover cache did not tell call sites apart.\n\nFix [#3727](https://github.com/fuma-nama/fumadocs/issues/3727)\n"
    filename: 2026-10-20-twoslash-call-signatures.md
    v: 0.0.0
