core:changelogs:
  - content: "---\npackages:\n  npm:@fumadocs/api-docs:\n    type: patch\n---\n\n## Survive `$ref` cycles in `dereferenceShallow`\n\nA Reference Object whose target eventually refers back to it overflowed the stack. The schema is now marked while its target resolves, so a cycle resolves to the sibling keywords instead of recursing forever.\n"
    filename: 2026-08-21-dereference-cycle.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: minor\n  npm:@fumadocs/graphql:\n    type: minor\n  npm:@fumadocs/sanity:\n    type: minor\n  npm:@fumadocs/local-content:\n    type: minor\n  npm:fumadocs-openapi:\n    type: minor\n  npm:@fumadocs/asyncapi:\n    type: minor\n---\n\n## Redesign source API\n\nContent sources can hook into the static loader they are attached to, and dynamic sources can opt out of the loader's in-memory file cache.\n\n`configureStatic` runs when a source is attached to `loader()`, and again whenever `dynamicLoader()` builds a new static loader:\n\n```ts\nexport function createMySource(): DynamicSource {\n  return {\n    cache: 'custom',\n    async files() {\n      return loadFiles();\n    },\n    configureStatic({ loader, source }) {\n      // `loader` is the created static loader\n      // `source` is the record key when using named sources\n    },\n    configure(loader, { source }) {\n      loader.invalidate();\n    },\n  };\n}\n```\n\n- `cache: 'memory'` (default): `files()` is called once until `invalidate()`.\n- `cache: 'custom'`: the source caches itself. `dynamicLoader()` re-runs `files()` on `get()` and rebuilds only when the file list is shallowly different (by identity).\n\n## Integrations\n\nGraphQL cross-links are generated from the attached loader instead of a `baseUrl` option on `staticSource()`. Local, OpenAPI, and AsyncAPI `dynamicSource()` use `cache: 'custom'` and reuse generated files by identity until `invalidate()`.\n\nSanity now uses `cache: 'custom'` when given a `sanityFetch` from `next-sanity/live`, calling `invalidate()` in draft mode is no longer needed.\n"
    filename: 2026-08-20-source-api.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/asyncapi:\n    type: patch\n---\n\n## Cache the document proxy in `toStaticData`\n\nMatches `fumadocs-openapi`: the magic proxy is created once per document instead of once per generated page.\n"
    filename: 2026-08-21-asyncapi-proxy-cache.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## Return heading and text results from the Algolia client\n\n`algoliaClient` grouped hits into page, heading and text results, then dropped everything except pages. All three are now returned with highlighting, matching the other search clients.\n"
    filename: 2026-08-21-algolia-client-results.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## Fix locale-only pages leaking into other locales\n\ni18n storages no longer share folder arrays with the fallback locale. Locale-only pages previously appeared in every locale's page tree as duplicate nodes.\n"
    filename: 2026-08-21-i18n-folder-arrays.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## Index pages by URL\n\n`getPageByHref` resolves absolute URLs through an index instead of scanning all pages on every call.\n"
    filename: 2026-08-21-page-url-index.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n  npm:@fumadocs/notion:\n    type: patch\n---\n\n## Do not cache rejected promises\n\nThe dynamic loader's `files()`, Notion's page `load()`, `createFromSource`'s index build, and Shiki factory init retry on the next call after a transient failure, instead of returning the same rejection forever.\n"
    filename: 2026-08-21-retry-failed-promises.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## Highlight only the search results within `limit`\n\n`limit` bounds the returned hits, so search now stops at that many results instead of highlighting every matched page and slicing afterwards.\n"
    filename: 2026-08-21-search-limit-highlight.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/local-content:\n    type: patch\n---\n\n## Read files in bounded chunks during a cold scan\n\n`getFiles()` awaits each chunk before starting the next, instead of starting the entire tree concurrently.\n"
    filename: 2026-08-21-local-content-chunked-scan.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-mdx:\n    type: patch\n---\n\n## Scope `lastModified` git log to the content directory\n\n`git log` is scoped to the collection's content directory instead of buffering the repository's entire history in every worker.\n"
    filename: 2026-08-21-mdx-scoped-git-log.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-mdx:\n    type: patch\n---\n\n## Fix Vite dev server crash on declaration-only dependencies\n\nThe injected Vite config no longer pre-bundles packages without runtime JavaScript, such as `@types/mdx`. Pre-bundling them made esbuild parse `.d.ts` files and fail on imports that only exist in type space, crashing the dev server.\n"
    filename: 2026-08-21-vite-types-only-deps.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-mdx:\n    type: patch\n---\n\n## Encode `import.meta.glob` query values\n\nThe Vite codegen passed the query to `import.meta.glob` as an object, letting the bundler serialize it. Rolldown inlines the values as-is, so a macro id such as `src/lib/source.ts#docs` left an unescaped `/` in the content file's module id and relative imports from that module (e.g. images from `![Banner](/logo.png)`) failed to resolve, since the importer's directory is derived from the raw id.\n\nThe query is now serialized (and percent-encoded) by Fumadocs itself, matching what the Node.js codegen already did.\n"
    filename: 2026-08-22-mdx-glob-query-encoding.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/notion:\n    type: patch\n---\n\n## Remember verified file URLs in the Notion file handler\n\nEvery asset request cost between 2 and 34 Notion API calls, so a page with a handful of images tripped the rate limit with two concurrent visitors. The handler now remembers a verified signed URL per block until shortly before Notion's `expiry_time`.\n"
    filename: 2026-08-21-notion-file-handler-cache.md
    v: 0.0.0
