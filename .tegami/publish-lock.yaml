core:changelogs:
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## Forward dynamic loader from `fumadocs-core/source`\n"
    filename: 2026-08-22-mt4e0wge.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n  npm:@fumadocs/local-md:\n    type: patch\n  npm:@fumadocs/local-html:\n    type: patch\n  npm:fumadocs-obsidian:\n    type: patch\n  npm:@fumadocs/satteri:\n    type: patch\n---\n\n## Read structured data from `page.data.structuredData()`\n\nSearch indexing no longer falls back to `(await page.data.load()).structuredData`. Runtime content sources expose `structuredData()` on page data instead, sharing the compile with `load()`:\n\n```ts\nconst structuredData = await page.data.structuredData();\n```\n\nThe renderer returned by `load()` still carries `structuredData`, existing code keeps working.\n"
    filename: 2026-08-23-structured-data.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/local-content:\n    type: patch\n  npm:@fumadocs/notion:\n    type: patch\n  npm:fumadocs-openapi:\n    type: patch\n  npm:@fumadocs/sanity:\n    type: patch\n---\n\n## Simplify cache\n"
    filename: 2026-08-23-mt4qk52y.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-python:\n    type: major\n---\n\n## Runtime content source\n\n`createPython()` serves the JSON generated by `fumapy-generate` directly, without generating MDX files:\n\n```ts\nimport { dynamicLoader } from 'fumadocs-core/source';\nimport { createPython } from 'fumadocs-python';\n\nconst python = createPython({\n  file: './httpx.json',\n});\n\nconst pythonLoader = dynamicLoader(python.dynamicSource(), {\n  baseUrl: '/docs',\n});\n```\n\nPages are compiled in memory with `page.data.load()`, `render()` includes the default MDX components of Fumadocs UI and `fumadocs-python/components`. Links between modules and classes are resolved from the loader the source is attached to, and `loaderPlugin()` badges generated pages in the page tree.\n\n`convert()` shares the same page builder. `write()` takes the output directory directly, and keeps the package name in file paths:\n\n```ts\nawait write(convert(content, { baseUrl: '/docs' }), 'content/docs');\n```\n"
    filename: 2026-08-23-python-source.md
    v: 0.0.0
