core:changelogs:
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  \"@fumadocs/satteri\":\n    type: patch\n---\n\n### Clearer error for unknown code languages\n\n- Rehype Code names the unknown language of a code block and suggests `fallbackLanguage`.\n- Sätteri accepts `rehypeCodeOptions` without `themes`, the defaults fill in the rest.\n"
    filename: 2026-11-17-rehype-code-unknown-language.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Fix `baseDir` with the `dir` parser\n\n- A source with `baseDir` keeps its languages with `parser: 'dir'`.\n"
    filename: 2026-11-18-base-dir-dir-parser.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: patch\n  \"@fumadocs/local-content\":\n    type: patch\n  \"@fumadocs/sanity\":\n    type: patch\n  \"@fumadocs/notion\":\n    type: patch\n---\n\n### Fix `baseDir` with the `dir` parser\n\n- A source with `baseDir` keeps its languages with `parser: 'dir'`.\n"
    filename: 2026-11-18-sources-base-dir.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: patch\n---\n\n### Macro collections in workspace packages\n\n- Declare macro collections in a workspace package and import them from several apps, each loading its own content.\n- Fix `!` patterns in the `files` option of collections not excluding files on Vite.\n- Accept `rehypeCodeOptions` without `themes`, the defaults fill in the rest.\n"
    filename: 2026-11-17-macro-workspace-packages.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Support the HTTP QUERY method\n\n- Generate pages and code samples for `query`, `options` and `trace` operations, with a playground for the methods browsers can send.\n- Show QUERY in its own color, and OPTIONS, TRACE and unknown methods in gray.\n- The playground sends its requests to the proxy as `POST`, so the proxy route only needs a `POST` handler and supports every method.\n- The proxy keeps the method of non-POST requests on 301/302 redirects, like `fetch()`.\n- Example request bodies leave out read-only properties for every method.\n- The playground centers its empty parameters message, and response descriptions replace \"No example available.\".\n"
    filename: 2026-11-19-openapi-query-method.md
    v: 0.0.0
