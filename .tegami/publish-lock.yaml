core:changelogs:
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n  \"@fumadocs/graphql\":\n    type: patch\n  \"@fumadocs/ai-chat\":\n    type: patch\n  \"@fumadocs/notion\":\n    type: patch\n  \"@fumadocs/story\":\n    type: patch\n---\n\n### Focus indicators in forced colors mode\n\n- Focus indicators stay visible in Windows High Contrast and other forced colors modes.\n"
    filename: 2026-11-21-forced-colors-focus.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n  \"@fumadocs/graphql\":\n    type: patch\n---\n\n### API docs fixes\n\n- Titles generated from ids keep acronyms and mixed-case names whole, like `HTTPServer` to \"HTTP Server\" and `KSeF`.\n- With `includeDescription`, pages of a tag or a file keep the tag's or the document's description in their body.\n- OpenAPI: request bodies and responses of sequential media types with only an `itemSchema` (OpenAPI 3.2), like JSON Lines and Server-Sent Events, show their items' schema, examples and playground.\n- OpenAPI: the Scalar modal of `withScalar()` follows the site's light or dark mode.\n- OpenAPI: no more undici warning about the `patch` method on the server.\n"
    filename: 2026-11-21-api-docs-fixes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/base-ui\":\n    type: patch\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n  \"@fumadocs/graphql\":\n    type: patch\n  \"@fumadocs/story\":\n    type: patch\n---\n\n### Fix borders next to Base UI triggers\n\n- Opening a sidebar tab menu in the Spacious layout no longer shifts its trigger content.\n- The \"Show Property\" row of playground and story fields no longer draws an extra bottom border.\n"
    filename: 2026-11-21-spacious-tabs-menu-shift.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Accessibility fixes\n\n- The footer of the default and Algolia search dialogs renders inside the dialog, and no longer in the page while the dialog is closed.\n- Text meets WCAG AA contrast in every color preset, in light and dark mode, including muted text, active items and search results.\n- Collapsed sidebars of the notebook, glass and flux layouts leave the tab order, and the flux sidebar and the spacious drawer follow their triggers in it.\n- The skip-to-content link shows when focused, the glass layout's table of contents opens on keyboard focus, and tabs and table-of-contents and menu triggers show a focus ring.\n- The glass sidebar's folder toggles are named after their folders, and the language select keeps the visible language in its name and marks options with `lang`.\n"
    filename: 2026-11-21-ui-accessibility.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Directive admonitions in processed Markdown\n\n- `remarkDirectiveAdmonition` keeps the authored directive in processed Markdown of the `function` output.\n"
    filename: 2026-11-20-directive-admonition-markdown.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Unique search record ids\n\n- The records of a page take the ids `<page id>#<n>`, so they no longer collide with another page's id, like `/blog/v3` and `/blog/v3-2`. Re-sync Algolia and Orama Cloud indexes to pick up the new ids.\n- `sync()` and `syncI18n()` of Orama Cloud return their transactions, so you can commit or roll back an index synced with `autoDeploy: false`.\n"
    filename: 2026-11-21-search-record-ids.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-epub:\n    type: patch\n---\n\n### Processed Markdown in EPUB chapters\n\n- Chapters read the processed Markdown of pages by default, instead of the raw MDX with its frontmatter, imports and JSX.\n"
    filename: 2026-11-21-epub-processed-markdown.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/json-schema\":\n    type: patch\n  fumadocs-openapi:\n    type: patch\n---\n\n### Fix playground crash on free-form JSON request bodies\n\n- The playground no longer crashes with free-form JSON request bodies.\n"
    filename: 2026-11-20-fix-playground-magic-proxy-clone.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-preview:\n    type: patch\n---\n\n### Current default AI model\n\n- The AI chat defaults to `anthropic/claude-sonnet-5.5` on OpenRouter, replacing the retired Claude 3.5 Sonnet.\n"
    filename: 2026-11-21-preview-ai-model.md
    v: 0.0.0
