core:changelogs:
  - content: "---\npackages:\n  \"@fumadocs/astro\":\n    type: patch\n  create-fumadocs-app:\n    type: patch\n---\n\n### Official Astro support\n\n- New `@fumadocs/astro` integration, running the Markdown features of Fumadocs on the Sätteri processor of Astro. It adds the React and MDX integrations unless they are configured.\n- MDX content renders as one React island with the `components` of its collection, Fumadocs UI components work in full. Without them, it renders as Astro MDX.\n- The `wrapper` component receives the props of `<Content />`, for providers like i18n.\n- Islands with `transition:persist` keep their state on navigation, the content of the new page moves into them.\n- The `collections` option defines the content directories of Fumadocs, each can override the options of the integration. `pageLoader()` and `metaLoader()` load them by name into Astro content collections with the schemas of Fumadocs, and `toFumadocsSource()` creates the source of Fumadocs. Its pages load their content with `page.data.load()`, like other content sources.\n- The Astro template uses `@fumadocs/astro`.\n"
    filename: 2026-10-24-astro-integration.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n---\n\n### Unions of `const` members render as a labelled select\n\n- In the playground, a `oneOf`/`anyOf` whose members are all `const` is one select labelled by each member's `title`, instead of a switch between members.\n"
    filename: 2026-10-23-openapi-labelled-const-options.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n---\n\n### Index card links with `contentDir`\n\n- `index.url.contentDir` of `generateFiles()` resolves the generated pages from the `output` directory, card links no longer start with `../`.\n- Card links use forward slashes on Windows.\n"
    filename: 2026-10-24-api-index-card-hrefs.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Keep the theme on Astro navigations\n\n- The Astro `RootProvider` keeps the theme across navigations of the Astro client router.\n"
    filename: 2026-10-24-astro-theme.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Faster and more stable TOC\n\n- `TOCItems` of the `normal` and `clerk` styles no longer throws \"is not iterable\" when navigating between pages quickly.\n- The TOC track is measured once per change and drawn before paint: less work on navigation, no frame showing the previous page's track.\n- The `normal` style highlights the active range right after the page loads, not only after the first scroll.\n- Custom heading IDs containing quotes no longer crash the `normal` and `clerk` styles.\n\nFix [#3754](https://github.com/fuma-nama/fumadocs/issues/3754)\n"
    filename: 2026-10-26-toc-fast-navigation.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n---\n\n### Search sync on Vercel\n\n- The Next.js sync script of `feature search` finds `static.json` when Next.js builds with an adapter, like on Vercel.\n"
    filename: 2026-10-23-search-sync-next-adapter.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n---\n\n### Astro support\n\n- `init`, `feature docs`, `og`, `llms`, `search`, `webmcp` and `feedback` support Astro projects, including `init --i18n`.\n- `mcp` and `epub` support Astro projects with `output: 'server'`, `export epub --framework astro` fetches from the running server.\n- `og`, `llms` and `search` follow the i18n routes of Astro projects.\n- `ai` refuses Astro projects.\n\n### Fixes\n\n- `init --i18n` names the languages of the language switch, and translates the UI of `cn` with `@fumadocs/language`.\n- Properties added to an empty config object, like `defineConfig({})`, go on their own lines.\n- With `hideLocale: 'default-locale'`, `baseOptions()` links the home of the default language to `/`.\n"
    filename: 2026-10-24-cli-astro.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Copy the page tree on deserialization\n\n- `deserializePageTree()` and `useFumadocsLoader()` no longer mutate the serialized page tree.\n"
    filename: 2026-10-24-deserialize-page-tree.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Keep the AsyncAPI data of generated pages\n\n- `pageSchema` keeps `_asyncapi` in the frontmatter of pages generated by Fumadocs AsyncAPI, like `_openapi`.\n"
    filename: 2026-10-28-page-schema-asyncapi.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### TanStack links with a hash or search params\n\n- Links like `/docs/page#heading` or `/docs/page?q=1` preload and open the right page in the TanStack adapter.\n\nFix [#3758](https://github.com/fuma-nama/fumadocs/issues/3758)\n"
    filename: 2026-10-28-tanstack-link-hash.md
    v: 0.0.0
  - content: "---\npackages:\n  create-fumadocs-app:\n    type: patch\n---\n\n### Hide server-only search on static templates\n\n- The search prompt hides Mixedbread on static, SPA and Astro templates.\n"
    filename: 2026-10-24-create-app-static-search.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-epub:\n    type: patch\n---\n\n### Export without a bundler\n\n- Use the named `EPub` export of `epub-gen-memory`, its CommonJS default export broke the export on runtimes without a bundler, like Astro.\n"
    filename: 2026-10-24-epub-named-import.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Names of OpenAPI selects\n\n- Add Chinese translations for the names of the selects on operation pages and union schemas.\n"
    filename: 2026-10-24-language-select-names.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/mdx-remote\":\n    type: patch\n---\n\n### `compileFile()` parses frontmatter\n\n- `compileFile()` strips the frontmatter from the content and parses it into `file.data.frontmatter`, unless the file already has it. Content compiled for the client no longer renders its frontmatter.\n- `compile()` works when destructured from the compiler.\n"
    filename: 2026-10-28-mdx-remote-frontmatter.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### `renderParameterField` can render the default input with another schema\n\n`renderParameterField` gets `ctx.renderDefault(schema)` as its third argument, which renders the parameter's default input with `schema` replacing its own. For example, an `enum` of values loaded at runtime shows the playground's select.\n"
    filename: 2026-10-23-openapi-render-parameter-field-default.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Names for the selects of operation pages\n\nThe selects that switch the code language, the example request, the response status, the media type, the security scheme and the variant of a union schema now have an accessible name, so a screen reader announces what they choose and not only their value. The names go through `t()` like the other labels. `ExampleSelect` accepts an `aria-label`.\n"
    filename: 2026-10-24-openapi-select-names.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### The proxy keeps `fetch()` working\n\n- Without `allowedOrigins`, the proxy imports undici, which replaced the dispatcher of the built-in `fetch()`. Afterwards, `fetch()` rejected requests setting `content-length`, and ignored configured dispatchers like `NODE_USE_ENV_PROXY`. The dispatcher is now restored.\n- The proxy no longer forwards `content-length`, `fetch()` sets it from the body.\n"
    filename: 2026-10-28-openapi-proxy-fetch.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/satteri\":\n    type: patch\n---\n\n### TOC options in preset\n\n- Add `rehypeTocOptions` to the preset options.\n"
    filename: 2026-10-24-satteri-toc-options.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/story\":\n    type: patch\n---\n\n### Story panel refinements\n\n- Inset the preview panel, without separators between the header, preview and controls.\n- Hide the fullscreen button when the browser doesn't support fullscreen.\n"
    filename: 2026-10-24-story-inset-preview.md
    v: 0.0.0
