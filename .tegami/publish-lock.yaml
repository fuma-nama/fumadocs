core:changelogs:
  - content: "---\npackages:\n  fumadocs-ui:\n    type: minor\n  \"@fumadocs/base-ui\":\n    type: minor\n  \"@fumadocs/cli\":\n    type: patch\n---\n\n### Place AI chat in layouts\n\nDocs, Notebook, and Glass layouts accept an `aiChat` option, pass your chat as `aiChat.panel` and the layout places it beside the page on wide viewports, and floats it over the page on smaller ones.\n\nYour chat component no longer needs layout-specific positioning, like targeting `#nd-docs-layout` or overriding `--fd-right-width`.\n\nThe `ai` feature of Fumadocs CLI now renders your docs layout from a client component at `ai/layout.tsx` in your components directory, which passes the installed chat to `aiChat`. It supports Docs, Notebook, Glass, and Spacious layouts, and only adds a floating trigger to the layouts without their own.\n"
    filename: 2026-10-03-ai-chat-panel.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Export Glass layout as `DocsLayout`\n\nLike other docs layouts, `fumadocs-ui/layouts/glass` exports `DocsLayout`, `DocsLayoutProps`, and `DocsSlots`. The `GlassLayout` names remain as aliases.\n"
    filename: 2026-10-03-glass-docs-layout.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/base-ui\":\n    type: minor\n  \"@fumadocs/cli\":\n    type: patch\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Introduce Spacious Layout\n\nA less compact version of Docs Layout, the page sits in an inset panel beside the sidebar, with page-level actions at the top of the panel.\n\n- Use it from `fumadocs-ui/layouts/spacious` and `fumadocs-ui/layouts/spacious/page`, and import the styles from `fumadocs-ui/css/generated/spacious.css`.\n- Pass `aiChat.panel` to render your AI chat in the layout, docked beside the page on wide screens and floating over it on smaller ones.\n- Customize it with `npx @fumadocs/cli customize`, only available for Base UI.\n\nThe Chinese presets of `@fumadocs/language` include translations for its new strings.\n"
    filename: 2026-10-03-spacious-layout.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: minor\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Redesigned API playground\n\nThe playground moves into a dialog, opened from **Try in Playground** on the endpoint bar of API pages.\n\n- The URL bar selects the server, edits its variables, and fills path parameters inline.\n- Auth, parameters and the request body are edited in one panel, one row per field with its type in the input. Descriptions and constraints like ranges and defaults open from the info button next to the field name.\n- Nested objects and arrays open in their own panel, navigated with breadcrumbs. The current breadcrumb switches between the nested fields of its parent, and the body can be edited as JSON.\n- OAuth 2.0 authorization opens in the same panel instead of a nested dialog, with the flow, client credentials and scopes to request. When a flow redirects to authorize, the playground reopens with the token once it returns to the page.\n- The response shows beside the code usages with its status, duration, size and headers. Until a request is sent, the documented response examples are shown instead.\n- Send requests with <kbd>Cmd/Ctrl</kbd> + <kbd>Enter</kbd>.\n\n`components.CollapsiblePanel` of the playground options is removed, with the `DefaultCollapsiblePanel` and `CollapsiblePanelProps` exports of `fumadocs-openapi/ui/playground/client`.\n\nExtra props of `<PlaygroundClient />` like `className` now go to its endpoint bar instead of a form, so form props like `onSubmit` are no longer accepted.\n"
    filename: 2026-10-03-openapi-playground-dialog.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: minor\n---\n\n### Headless API playground\n\n`usePlayground()` from `fumadocs-openapi/playground` holds the state of an API playground: its form, auth and the request it sends. The playground installed with Fumadocs CLI is built on it, so the installed code is only UI.\n\n- Responses of `createBrowserFetcher()` carry `duration`, `mediaType`, `fileName` and `text()`.\n- Parameters of `useOperation()` are typed as `OperationParameter`, with the `name` and `in` required by OpenAPI. Parameters without a name are skipped.\n- `writeOnly` and `readOnly` of `<PlaygroundClient />` are deprecated, they default to the values for requests.\n- `FormValues` of `fumadocs-openapi/ui/playground/client` is deprecated.\n"
    filename: 2026-10-04-openapi-headless-playground.md
    v: 0.0.0
