core:changelogs:
  - content: "---\npackages:\n  npm:@fumadocs/api-docs:\n    type: patch\n---\n\n## Preserve `description` when merging `allOf` schemas\n\n`mergeAllOf()` no longer drops descriptions defined inside `allOf` members, so this common composition pattern renders its description in the Schema UI:\n\n```yaml\namount:\n  allOf:\n    - $ref: '#/components/schemas/Money'\n    - description: Property-specific description\n```\n\nThe last defined description among members wins, and a description on the outer schema keeps precedence over all of them.\n"
    filename: 2026-08-25-allof-description.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-openapi:\n    type: patch\n  npm:@fumadocs/language:\n    type: patch\n---\n\n## Enhance result display of API playground\n\nThe response panel now gives you the full picture of a request:\n\n- the resolved request URL, including path and query parameters\n- response headers in a collapsible list\n- response body labeled with its content type\n\nClient-side errors also show the request URL, making issues like a wrong server URL easy to spot.\n\nFor custom `ResultDisplay` components, `FetchResult` now carries a `url` field.\n\n`@fumadocs/language` includes translations for the new UI.\n"
    filename: 2026-08-25-playground-result-display.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-openapi:\n    type: patch\n---\n\n## Improve OAuth Password Flow\n\nSupport optional Client ID and Client Secret in the OAuth password flow of API playground, they are sent along the token request when specified.\n"
    filename: 2026-08-25-oauth-password-client-credentials.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-python:\n    type: patch\n---\n\n## `groupBy` option\n\nGenerated pages are grouped in a directory named after the root module. Set `groupBy: 'none'` to place them at the root of the source instead, the root module becomes `index.mdx`:\n\n```ts\nconst python = createPython({\n  file: './httpx.json',\n  groupBy: 'none',\n});\n```\n\n`convert()` accepts the same option.\n"
    filename: 2026-08-24-python-root-pages.md
    v: 0.0.0
