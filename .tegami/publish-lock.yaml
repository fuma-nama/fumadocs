core:changelogs:
  - content: "---\npackages:\n  \"@fumadocs/changelog\":\n    type: minor\n---\n\n### New package: `@fumadocs/changelog`\n\n- `ChangelogEntry` describes an entry of your changelog, like a release.\n- `githubReleases()` from `@fumadocs/changelog/github` gets a page of the published releases of a GitHub repository.\n- `npx @fumadocs/cli add changelog` installs a timeline to render the entries.\n"
    filename: 2026-10-12-changelog-package.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/satteri\":\n    type: patch\n  fumadocs-typescript:\n    type: patch\n---\n\n### Code blocks in type tables\n\n- `remarkAutoTypeTable()` of `@fumadocs/satteri` highlights the code blocks in descriptions.\n- Code blocks of unknown languages in descriptions are shown as plain text, instead of failing the build.\n"
    filename: 2026-10-12-type-table-code-blocks.md
    v: 0.0.0
