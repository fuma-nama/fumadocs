core:changelogs:
  - content: "---\npackages:\n  \"@fumadocs/asyncapi\":\n    type: patch\n---\n\n### TypeScript definitions on copy\n\n- Message schemas generate their TypeScript definitions when the button copies them, not on every render.\n"
    filename: 2026-10-18-asyncapi-typescript-on-copy.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n---\n\n### Example cards with code block title bars\n\n- Example cards put their controls in the title bar of their code block, next to its copy button, so code no longer runs under the button on narrow screens.\n- Selects with a single option, like one status code, show a plain label.\n- The playground button follows the corner radius of the bar around it.\n"
    filename: 2026-10-18-example-card-copy.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n  \"@fumadocs/graphql\":\n    type: patch\n---\n\n### Generated pages in every language\n\n- Virtual files accept a `locale`, `$` for every language, instead of parsing it from their path.\n- Pages from `staticSource()` and `dynamicSource()` of OpenAPI, AsyncAPI and GraphQL are shared with every language of `loader()`.\n\nFix [#3720](https://github.com/fuma-nama/fumadocs/issues/3720)\n"
    filename: 2026-10-19-shared-generated-pages.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### i18n `parser: 'none'`\n\n- `parser: 'none'` no longer parses locales from file paths, files without a `locale` belong to the default language.\n"
    filename: 2026-10-19-core-none-parser.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/graphql\":\n    type: minor\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Redesigned GraphQL pages\n\n- Operation pages start with their signature and directives, like `QUERY customer(id: ID!): Customer`, and keep the types they use in place: arguments and return types open in Schema UI panels.\n- Pages of named types are opt-in with `includeTypes`, they show the SDL of types and where they are used.\n- Example requests and responses beside operations, with a select of examples and code samples in cURL, JavaScript, Go, Python, Java, C# and Rust.\n- Named examples from GraphQL documents with the `examples` option of `createGraphQL()`.\n- The playground opens in a dialog: an editor with validation and formatting, variables as a form or JSON, headers, and responses with their GraphQL errors.\n- The playground runs subscriptions over graphql-ws or GraphQL over SSE (`subscriptionUrl`), and logs their events.\n- Directives applied in the schema show their definitions, `@oneOf` input objects are supported.\n- `getText()` returns pages in Markdown for LLMs, operations with the SDL of types they use.\n- Chinese translations of GraphQL pages in `@fumadocs/language`.\n\n### API changes\n\n| Before                                                                  | Now                                                        |\n| ----------------------------------------------------------------------- | ---------------------------------------------------------- |\n| pages of named types by default                                         | `includeTypes: true`, also for `per: 'file'`               |\n| `useOperation().example`                                                | `examples`, with `selected` and `select()`                 |\n| `slots.relations` and `slots.scalar` of `renderTypeLayout`              | `slots.definition`, `usages` and `sdl`                     |\n| `@fumadocs/graphql/utils/snippets`                                      | the `codeUsages` option                                    |\n| `inputTypeToJsonSchema(type, depth)`                                    | `inputTypeToJsonSchema(type)`, recursive inputs are shared |\n| `slots.directives` of `renderOperationLayout` and `renderTypeLayout`    | in `slots.playground` and `slots.definition`               |\n| `renderArguments` of `generateGraphQLSchemaUI()`, `SchemaViewRoot.args` | arguments open in their own panel                          |\n\n- Added `createCodeUsageGeneratorRegistry()` and `registerDefaultCodeUsages()` to `@fumadocs/graphql/ui`.\n- Added `usePlayground()`, `useRequestValues()` and `subscribeGraphQL()` to `@fumadocs/graphql/playground`, the installed playground runs on them.\n- Removed `HeaderItem`, `filterHeaderItems()`, `readStored()`, `writeStored()`, `getEndpointOrigin()` and `syncOperationVariables()` from `@fumadocs/graphql/playground`, `usePlayground()` keeps headers by endpoint origin.\n- Added `relations.unions` to `useNamedType()`.\n- The Schema UI root also takes a schema coordinate, like `Query.orders()` for the arguments of `Query.orders`.\n"
    filename: 2026-10-17-graphql-redesign.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/json-schema\":\n    type: patch\n---\n\n### Info tags that open schemas\n\n- An `InfoTag` with `open: { name, $ref }` opens the schema `$ref` in Schema UI, like the type of a property.\n"
    filename: 2026-10-18-schema-ui-open-tag.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Smaller bundles\n\n- `fumadocs-openapi/ui/base` and `createOpenAPIBaseRenderer()` no longer bundle the full Shiki bundle.\n\nFix [#3714](https://github.com/fuma-nama/fumadocs/issues/3714)\n"
    filename: 2026-10-17-openapi-base-shiki.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Code samples\n\n- Bodies with quotes, line breaks, NUL, BOM or bidi characters produce valid Python, Java, Go, Rust, JavaScript and C# samples that send them exactly.\n- Go and Rust samples no longer indent the lines of multi-line bodies.\n- `text/plain` bodies are sent as written, in samples and the playground.\n- cURL samples send JSON bodies of `+json` and `; charset=` media types as JSON.\n"
    filename: 2026-10-17-openapi-code-samples.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Tag hierarchy in `per: 'tag'`\n\n- Pages follow the OpenAPI 3.2 tag hierarchy, in the folder of their `parent` tag.\n- Tags without operations or with a `kind` other than `nav` get no page.\n- Undeclared tags get pages too, untagged operations are listed in `unknown`.\n- Index cards of `generateFiles()` include pages in folders.\n\nFix [#3719](https://github.com/fuma-nama/fumadocs/issues/3719)\n"
    filename: 2026-10-19-openapi-per-tag-hierarchy.md
    v: 0.0.0
