core:changelogs:
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  \"@fumadocs/cli\":\n    type: patch\n  create-fumadocs-app:\n    type: patch\n---\n\n### Meilisearch integration\n\nSearch your docs with [Meilisearch](https://www.meilisearch.com), self-hosted or on Meilisearch Cloud.\n\n- `toDocuments()` and `sync()` from `fumadocs-core/search/meilisearch` export your pages and replace the documents of an index, old documents stay searchable until the new ones are indexed.\n- `meilisearchClient()` from `fumadocs-core/search/client/meilisearch` searches from the browser with `useDocsSearch()`, filtered by tag and locale.\n\n```tsx\nconst client = new Meilisearch({ host, apiKey: searchKey });\n\nuseDocsSearch({\n  client: meilisearchClient({ client, indexName: 'docs', locale }),\n});\n```\n\nSet it up with `npx @fumadocs/cli feature search --provider meilisearch`, or choose it in `create-fumadocs-app`.\n\nFix [#3627](https://github.com/fuma-nama/fumadocs/issues/3627)\n"
    filename: 2026-10-01-meilisearch.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n  create-fumadocs-app:\n    type: patch\n---\n\n### Simpler search sync setup\n\n- `feature search` writes the path of the pre-rendered `static.json` into `scripts/sync-content.ts`, and the `build` script runs it without arguments.\n- On TanStack Start, the path follows the Nitro output: `.output/public`, `.vercel/output/static` with the `vercel` preset, or `dist/client` without Nitro.\n- Typesense documents are built in the `static.json` route, without a separate `lib/export-search-indexes.ts`.\n"
    filename: 2026-10-01-search-sync-script.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Download response bodies from the playground\n\nThe result panel of the API playground has a **Download** button for non-empty responses. The file is named from the `Content-Disposition` header, preferring `filename*` and without directories, otherwise `response`, which browsers complete with the extension of the media type.\n\nFor the browser to read `Content-Disposition`, cross-origin APIs have to list it in `Access-Control-Expose-Headers`, or be requested through the proxy.\n\nFix [#3625](https://github.com/fuma-nama/fumadocs/issues/3625)\n"
    filename: 2026-09-30-openapi-download-response.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: patch\n---\n\n### Keep collection `dir` outside the project in file paths\n\nWhen a collection's `dir` was outside the project (e.g. `../content/docs`), the leading `../` was dropped from `info.fullPath` and `absolutePath`, so `getText('raw')` failed with `ENOENT`.\n\nFix [#3623](https://github.com/fuma-nama/fumadocs/issues/3623)\n"
    filename: 2026-09-30-mdx-outside-dir.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Send OAuth client credentials as HTTP Basic by default\n\nToken requests of the playground default to **Send as Basic Auth header**, which RFC 6749 requires authorization servers to support.\n\n- The authorization code flow has the **Client Authentication** selector too, it always sent the client credentials in the body.\n- The password flow no longer requires client credentials with either method.\n- Without a client secret, the `client_id` is sent in the body instead, as public clients do.\n\nFix [#3629](https://github.com/fuma-nama/fumadocs/issues/3629)\n"
    filename: 2026-10-01-openapi-oauth-basic-default.md
    v: 0.0.0
