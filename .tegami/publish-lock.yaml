core:changelogs:
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Layout fixes\n\n- Docs Layout: layout tabs with `tabMode: 'top'` no longer cover the page.\n- Glass Layout: sidebar items are not all active with a page tree without `$id`.\n- Glass Layout: icons of layout tabs are sized correctly with the default `tabs` option.\n"
    filename: 2026-10-13-layout-fixes.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Faster `loader()`\n\n- Page trees are built faster, especially with custom `sort` options.\n- Faster `loader()` setup and page lookups like `getPage()` and `getPageByUrl()`.\n- Fallback page trees of i18n sources keep the locale in URLs and IDs.\n- A page listed in `pages` is no longer duplicated when another folder takes it with a higher priority, like `pagesIndex`.\n"
    filename: 2026-10-13-faster-loader.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/story\":\n    type: minor\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Redesigned story controls\n\n- Props are edited in rows like the OpenAPI playground, nested objects and arrays open in a panel with breadcrumbs.\n- Reset the props to the defaults of the variant.\n- `fixed` values hide their controls with the Vite plugin and Turbopack loader too.\n- Switching back to a variant restores its default values.\n- `getDefaultValue()` leaves optional properties unset, `typeToString()` prints enums as their members.\n- Updated translation keys of the controls, see `@fumadocs/language` for the new ones.\n"
    filename: 2026-10-13-story-controls.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Playground focus\n\n- Focused fields highlight their own border, instead of a ring inside the column borders.\n"
    filename: 2026-10-13-playground-focus.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/story\":\n    type: minor\n---\n\n### Story frames\n\n- New `frame` option of `defineStory()`, renders components filling the viewport (e.g. layouts) in an iframe, scaled to fit the panel. Its `Container` wraps the frame, like a window.\n- `story.Frame` renders the component on the frame page, with the arguments from the story panel.\n- Story components can be any component type, like lazy ones that only the frame page loads.\n- `useStoryFrame()` connects your own panel to the frame.\n"
    filename: 2026-10-13-story-frame.md
    v: 0.0.0
