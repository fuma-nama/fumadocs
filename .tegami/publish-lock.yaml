core:changelogs:
  - content: "---\npackages:\n  npm:@fumadocs/cli:\n    type: minor\n---\n\n## `init` and `feature` commands\n\nThe CLI now configures Fumadocs on an existing app and adds features to it, beyond installing UI components. Supported on Next.js, React Router, TanStack Start and Waku.\n\n```bash\nnpx @fumadocs/cli init\nnpx @fumadocs/cli feature llms\n```\n\n`init` adds the docs pages in a dedicated route group (e.g. `app/(docs)`) with their own provider, layout and search route, so your existing setup stays untouched: it only registers the Fumadocs MDX plugin in your bundler config, imports the styles into your global CSS and adds `suppressHydrationWarning` to `<html>`. Pass `--i18n` to set up internationalization with locale-prefixed routes.\n\n`feature <id>` installs the components and routes of a feature and wires them into your app: `ai` (Ask AI dialog), `llms` (`llms.txt`, `llms-full.txt` and per-page Markdown, with the `/docs/*.md` rewrite on Next.js), `mcp`, `webmcp` (experimental), `og`, `search` (Orama Cloud, Algolia, Typesense, Mixedbread), `feedback`, `epub` and `lint`. Features follow your setup: the `baseUrl` of your docs, `src/` directory, i18n, static export and SPA modes, Fumadocs MDX with the macro API or `source.config.ts`. Route URLs are read from the constants of `lib/shared.ts` (`docsRoute`, `docsContentRoute`, `docsImageRoute`), and route features add URL helpers like `getPageMarkdownUrl(page)` to `lib/source.ts`.\n\nEvery command takes `-y` to skip prompts and `--no-install` to only write dependencies to `package.json`.\n\nComponents are installed at the directories of your shadcn `components.json` by default, so the same component isn't duplicated in two places. `export epub` no longer scaffolds the export route, run `feature epub` instead.\n"
    filename: 2026-09-08-cli-features.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/cli:\n    type: patch\n  npm:create-fumadocs-app:\n    type: patch\n  npm:fumadocs-preview:\n    type: patch\n---\n\n## CLIs on `cac`\n\nThe CLIs are now built on [cac](https://github.com/cacjs/cac).\n"
    filename: 2026-09-09-cli-cac.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## `getPageByUrl()` on the loader\n\nLook up a page by its URL:\n\n```ts\nsource.getPageByUrl('/docs/getting-started');\nsource.getPageByUrl('/cn/docs/getting-started', 'cn');\n```\n\nWithout the `language` argument every language is looked up, unlike `getPageByHref()` which resolves the default language only.\n"
    filename: 2026-09-09-get-page-by-url.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## `llms()` renders pages\n\n`llms()` used to build the `llms.txt` index only, turning a page into Markdown was left to your own `getLLMText()`. Pass `renderPage` and it covers both:\n\n```ts\nimport { llms } from 'fumadocs-core/source';\n\nexport const docsLlms = llms(source, {\n  renderPage: async (page) => `# ${page.data.title} (${page.url})\n\n${await page.data.getText('processed')}`,\n});\n```\n\n- `page(page)` renders one page, for the per-page Markdown route.\n- `full(lang?)` renders every page and joins them, for `llms-full.txt`.\n\n```ts\n// app/llms-full.txt/route.ts\nexport const GET = async () => new Response(await docsLlms.full());\n```\n\nBoth methods exist only when `renderPage` is given, in types and at runtime. Fumadocs cannot know how your content source exposes Markdown: `page.data.getText('processed')` on Fumadocs MDX, `page.data.content` on `@fumadocs/local-md`.\n"
    filename: 2026-09-09-llms-render-page.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## `fumadocs-core/mcp`: docs tools for your MCP server\n\nRegister the docs tools on a server you own, rather than on a handler Fumadocs builds for you:\n\n```ts\nimport { createMcpHandler, McpServer } from '@modelcontextprotocol/server';\nimport { registerSearchTool, registerSourceTools } from 'fumadocs-core/mcp';\nimport { createFromSource } from 'fumadocs-core/search/server';\nimport { docsLlms, source } from '@/lib/source';\n\nconst handler = createMcpHandler(() => {\n  const mcp = new McpServer({ name: 'docs', version: '1.0.0' });\n\n  registerSourceTools(mcp, source, docsLlms);\n  registerSearchTool(mcp, createFromSource(source));\n\n  return mcp;\n});\n\nexport const GET = (req: Request) => handler.fetch(req);\nexport const POST = (req: Request) => handler.fetch(req);\nexport const DELETE = (req: Request) => handler.fetch(req);\n```\n\n| Function                                 | Tools                    |\n| ---------------------------------------- | ------------------------ |\n| `registerSourceTools(mcp, source, llms)` | `list_pages`, `get_page` |\n| `registerSearchTool(mcp, server)`        | `search`                 |\n\nEach takes the integration it reads from, so you can add your own tools next to them, point the search tool at another server, or register only one of the two.\n\n`@modelcontextprotocol/server` is an optional peer dependency, and `registerSourceTools` needs a `llms()` output with `renderPage`.\n"
    filename: 2026-09-09-mcp-tools.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## `toDocuments()` for Algolia and Orama Cloud\n\nBuild the search indexes of every page, instead of mapping pages by hand:\n\n```ts\n// app/static.json/route.ts\nimport { toDocuments } from 'fumadocs-core/search/algolia';\nimport { source } from '@/lib/source';\n\nexport const GET = async () => Response.json(await toDocuments(source));\n```\n\nIt awaits `structuredData` when your collection is async (React Router and TanStack Start), a step that was easy to miss. Pass `tag` to filter results by a value of your choice:\n\n```ts\ntoDocuments(source, { tag: (page) => page.slugs[0] });\n```\n\nExported from `fumadocs-core/search/algolia` and `fumadocs-core/search/orama-cloud`.\n"
    filename: 2026-09-09-search-to-documents.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## Marked as side-effect free\n\n`fumadocs-core` now declares `\"sideEffects\": false`. No module in the package imports for side effects or ships CSS, so bundlers that rely on the hint (webpack in particular) can drop unused modules instead of keeping them alive:\n\n```ts\nimport { createGetUrl } from 'fumadocs-core/source';\n```\n"
    filename: 2026-09-10-core-side-effects.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:create-fumadocs-app:\n    type: minor\n  npm:create-fumadocs-versions:\n    type: patch\n---\n\n## Search providers and shared CLI features\n\n`--search` accepts `algolia`, `typesense` and `mixedbread` in addition to `orama` and `orama-cloud`.\n\nSearch, linter, OG image and Ask AI options are now applied by the features of `@fumadocs/cli`, the same code that configures them on an existing app, instead of template plugins. `create-fumadocs-versions` pins the versions of the new search dependencies.\n"
    filename: 2026-09-08-create-app-features.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-epub:\n    type: patch\n---\n\n## `createEpubExportAPI()`\n\nA route handler for the EPUB export, replacing the auth check and response headers you had to write yourself:\n\n```ts\n// app/export/epub/route.ts\nimport { createEpubExportAPI } from 'fumadocs-epub';\nimport { source } from '@/lib/source';\n\nexport const { GET } = createEpubExportAPI({\n  source,\n  title: 'Documentation',\n  author: 'Your Team',\n  secret: process.env.EXPORT_SECRET,\n});\n```\n\n`secret` is required: requests must send `Authorization: Bearer <secret>`, and the route answers `503` while the secret itself is unset, so a missing environment variable cannot leave the export open. It also takes `filename` (default `docs.epub`) and every option of `exportEpub()`, which stays available for public routes and scripts.\n"
    filename: 2026-09-09-epub-export-api.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-openapi:\n    type: patch\n---\n\n## `path` in operation renderers\n\n`renderOperationLayout` and `generateCodeSamples` now receive the operation's `path`, so custom layouts no longer need a React context to reach it:\n\n```tsx\nrenderOperationLayout: (slots, { path, method }) => (\n  <div>\n    {slots.header}\n    <EndpointPreview path={path} method={method} />\n    {slots.description}\n    {slots.apiPlayground}\n  </div>\n);\n```\n"
    filename: 2026-09-10-openapi-operation-path.md
    v: 0.0.0
