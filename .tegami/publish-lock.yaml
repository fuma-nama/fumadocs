core:changelogs:
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Code Blocks are No Longer Region Landmarks\n\n- The scroll area of `CodeBlock` stays focusable but no longer has `role=\"region\"` without a name, so pages with several code blocks no longer repeat unnamed region landmarks.\n"
    filename: 2026-11-14-codeblock-region.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  \"@fumadocs/satteri\":\n    type: patch\n---\n\n### Unique heading IDs next to custom IDs\n\n- Headings after a custom `[#id]` no longer reuse it as their ID.\n"
    filename: 2026-11-14-custom-heading-ids.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### `usePathname()` During TanStack Router Navigations\n\n- Components that mount or hydrate while TanStack Router loads the next page get the pathname of the current page, like the components that were already mounted, instead of the next page's.\n"
    filename: 2026-11-14-tanstack-pathname.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Flexsearch builds each locale on its first search\n\n- `flexsearchFromSource()` and `flexsearchI18n()` build the index of a locale when it is first searched, instead of every locale on the first request.\n"
    filename: 2026-11-15-flexsearch-locale-index.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Chinese translations of AI chat\n\n- `zhTW()` and `zhCN()` translate `@fumadocs/ai-chat`.\n"
    filename: 2026-11-14-language-ai-chat.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Japanese language pack\n\n- `ja()` from `@fumadocs/language/ja` translates Fumadocs UI and its integrations into Japanese.\n"
    filename: 2026-11-14-language-ja.md
    v: 0.0.0
