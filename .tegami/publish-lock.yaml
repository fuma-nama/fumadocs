core:changelogs:
  - content: "---\npackages:\n  npm:fumadocs-openapi:\n    type: patch\n  npm:@fumadocs/api-docs:\n    type: patch\n  npm:@fumadocs/language:\n    type: patch\n---\n\n## Support HTTP Basic client authentication in OAuth password flow\n\nSome OAuth servers require client credentials in an HTTP Basic `Authorization` header instead of the request body. The password flow dialog now offers a Client Authentication select to choose between the two methods, as described in [RFC 6749, section 2.3.1](https://www.rfc-editor.org/rfc/rfc6749#section-2.3.1).\n\nFix [#3506](https://github.com/fuma-nama/fumadocs/issues/3506)\n"
    filename: 2026-08-26-oauth-basic-client-auth.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/base-ui:\n    type: patch\n  npm:fumadocs-ui:\n    type: patch\n---\n\n## Improve Vitepress theme\n\nMore contrast & aligned to Vitepress.\n"
    filename: 2026-08-26-mt9yaf75.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/satteri:\n    type: patch\n---\n\n## Fix tab names that consist of a single JSX element\n\nWith `parseMdx` enabled, `remarkCodeTab` unwrapped a tab name that was entirely one JSX element and kept only its children, so icon-only names like `tab=\"<Home />\"` rendered an empty trigger. Only paragraphs are unwrapped now, matching the behavior of `fumadocs-core`.\n"
    filename: 2026-08-26-code-tab-jsx-tab-names.md
    v: 0.0.0
