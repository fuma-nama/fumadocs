core:changelogs:
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Floating Ask AI button in docs layouts\n\n- `aiChat.trigger` renders a floating Ask AI button in the Docs and Notebook layouts. Glass and Spacious keep their own button.\n"
    filename: 2026-11-08-ai-chat-trigger.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n---\n\n### Keep MCP routes from holding serverless functions open\n\n- The generated MCP route no longer lets clients open a stream that lasts until the function times out.\n"
    filename: 2026-11-07-mcp-no-listen-stream.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: patch\n  fumadocs-obsidian:\n    type: patch\n  \"@fumadocs/notion\":\n    type: patch\n  \"@fumadocs/sanity\":\n    type: patch\n---\n\n### Components per page in press plugins\n\n- The press plugins of Fumadocs MDX, Obsidian, Notion and Sanity accept `components` as a function of the page, typed by the pages of the site.\n"
    filename: 2026-11-08-page-components.md
    v: 0.0.0
