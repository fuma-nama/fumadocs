core:changelogs:
  - content: "---\npackages:\n  \"@fumadocs/ai-chat\":\n    type: patch\n---\n\n### Accessible Ask AI button\n\n- The Ask AI button announces whether the chat is open.\n"
    filename: 2026-11-04-ai-chat-trigger-a11y.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/astro\":\n    type: minor\n---\n\n### Moved the managed setup to `@fumapress/astro`\n\n- Refactored: `@fumadocs/astro` is the integration for your own routes again.\n- `src/fumadocs.config.ts`, `@fumadocs/astro/config`, `@fumadocs/astro/plugins/*`, `HomeLayout.astro` and `ReactContent.astro` moved to `@fumapress/astro`.\n- Removed the `layout` and `page` options, use `ui.renderPage` of `@fumapress/astro`.\n- See `@fumapress/astro` for the plugins of the managed setup.\n- Added the `lastModified` collection option: `page.data.lastModified` is the date of the page's last commit.\n- `toFumadocsSource()` accepts `baseDir` as its third argument.\n"
    filename: 2026-11-03-astro-own-routes.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: minor\n  fumadocs-openapi:\n    type: minor\n  \"@fumadocs/asyncapi\":\n    type: minor\n  \"@fumadocs/graphql\":\n    type: minor\n  \"@fumadocs/notion\":\n    type: minor\n  fumadocs-obsidian:\n    type: minor\n  \"@fumadocs/sanity\":\n    type: minor\n---\n\n### Framework plugins\n\n- Added `fumadocs-core/framework/plugin`: the plugin API for integrations to add routes and page content to frameworks.\n- Integrations export their plugin as the default export of `/press`: `openapiPlugin()`, `asyncapiPlugin()`, `graphqlPlugin()`, `notionPlugin()`, `obsidianPlugin()` and `sanityPlugin()`.\n- The pages of `staticSource()` and `dynamicSource()` of OpenAPI, AsyncAPI and GraphQL have `full: true` in their page data, like generated files.\n"
    filename: 2026-11-03-framework-plugin.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: minor\n  \"@fumadocs/asyncapi\":\n    type: minor\n  \"@fumadocs/graphql\":\n    type: minor\n---\n\n### Deprecated standalone loader plugins\n\n- Deprecated `openapiPlugin()`, `asyncapiPlugin()` and `graphqlPlugin()` of `/server`: use `loaderPlugin()` of `createOpenAPI()`, `createAsyncAPI()` and `createGraphQL()` instead.\n"
    filename: 2026-11-04-standalone-loader-plugins-deprecated.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Hidden GitHub navigation icon\n\n- Hide the decorative GitHub navigation icon from assistive technology to avoid an unnamed SVG image in the accessibility tree. The link retains its GitHub label.\n"
    filename: 2026-10-18-github-icon-accessibility.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Accessibility fixes\n\n- Docs layouts render a visually hidden \"Skip to Content\" link as the first focusable element.\n- Escape closes the mobile sidebar drawer, and focus returns to the trigger when the drawer closes.\n- The heading \"Copy Anchor Link\" button is visible on keyboard focus.\n- A `Tab` `id` only links to the tab by URL hash, panels keep the ids that tab triggers point `aria-controls` at.\n- Multi-word tab labels produce ids without spaces.\n- TOC `single` mode highlights the clicked item and no longer skips headings while scrolling.\n- `DocsPage` `editOnGithub` defaults `sha` to `main` as documented.\n"
    filename: 2026-11-03-accessibility-fixes.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Language switcher closes on selection\n\n- The language switcher closes after choosing a language.\n"
    filename: 2026-11-04-language-select-close.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: minor\n  create-fumadocs-app:\n    type: patch\n---\n\n### Astro with your own routes\n\n- Refactored: set up Astro with your own routes, layout and provider again, the managed setup moved to `@fumapress/astro`.\n- On Astro, `og`, `llms`, `search`, `feedback` and `customise` write to your routes and components instead of `src/fumadocs.config.ts`.\n- On Astro, `llms` serves the Markdown of pages at `<page>.md`, `/docs/index.md` for the root page.\n- On Astro, routes that need a server (`mcp`, `epub`, server search) render on request with `output: 'static'` too.\n- On Astro, generated and template routes build pages whose file names need URI encoding, like spaces.\n- Removed the managed setup helpers: `ensureAstroOption` of `@fumadocs/cli/codemod`, `requiresManaged`, `requiresManagedMarkdown`, `addAstroPlugin`, `astroModule`, `astroModuleFile` and `addDocsLlms` of the features.\n"
    filename: 2026-11-03-cli-astro-own-routes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n---\n\n### Base UI installs\n\n- Installed components import Base UI as `fumadocs-ui`, without adding a second `@fumadocs/base-ui` dependency.\n"
    filename: 2026-11-05-cli-base-ui-package.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Typed loaders fit `LoaderOutput`\n\n- A loader typed by its content source and the translations of some languages are assignable to `LoaderOutput` and `TranslationsAPI`.\n"
    filename: 2026-11-02-typed-loader-assignable.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Smaller static Flexsearch index\n\n- The exported Flexsearch index is about 80% smaller, search results are unchanged.\n"
    filename: 2026-11-04-flexsearch-static-size.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### `renderUrl` option of `llms()`\n\n- `llms()` accepts `renderUrl` to change the links of pages.\n"
    filename: 2026-11-04-llms-render-url.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: patch\n---\n\n### Aliases in macro collections on Vite\n\n- Collections of `fumadocs-mdx/macro` resolve the Vite aliases of your app, like `resolve.tsconfigPaths`.\n"
    filename: 2026-11-02-macro-vite-aliases.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: minor\n---\n\n### Framework plugin\n\n- Added `mdxPlugin()` as the default export of `fumadocs-mdx/press`: it renders the pages of Fumadocs MDX collections in frameworks running `fumadocs-core/framework/plugin`, with your MDX `components` and relative links resolved.\n"
    filename: 2026-11-04-mdx-plugin.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: patch\n---\n\n### Faster Vite RSC builds\n\n- Vite builds with React Server Components compile MDX files faster.\n"
    filename: 2026-11-04-mdx-rsc-scan.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/notion\":\n    type: minor\n---\n\n### Deprecated `@fumadocs/notion/client`\n\n- Deprecated `@fumadocs/notion/client`: `NotionRenderer` hydrates its components through `'use client'`, they need no registration.\n"
    filename: 2026-11-03-notion-client-deprecated.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-preview:\n    type: patch\n---\n\n### Fix blank pages\n\n- Fix pages failing to render with `Missing Router`.\n"
    filename: 2026-11-03-preview-dedupe-waku.md
    v: 0.0.0
