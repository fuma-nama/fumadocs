core:changelogs:
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Search Dialog Close Button Name\n\n- `SearchDialogClose` keeps its visible text in its accessible name (e.g. \"ESC Close Search\"), so voice control users can activate it by the label they see.\n"
    filename: 2026-11-09-search-close-label.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Main Landmark in Spacious and Glass Layouts\n\n- The Spacious and Glass layouts wrap the page content in `<main>`, like the docs, notebook and flux layouts, so pages using them have a main landmark.\n"
    filename: 2026-11-11-main-landmark-spacious-glass.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Current Page in the Sidebar\n\n- The active sidebar link has `aria-current=\"page\"`, so screen readers announce which page is the current one. Applies to `SidebarItem`, `SidebarFolderLink` and the Glass layout's sidebar.\n"
    filename: 2026-11-11-sidebar-aria-current.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### TOC Popover is No Longer a Banner Landmark\n\n- The `<header>` of the mobile TOC popover has `role=\"none\"`, so pages no longer expose a second banner landmark next to the navbar.\n"
    filename: 2026-11-11-toc-popover-banner.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/astro\":\n    type: patch\n---\n\n### Code Blocks on Astro\n\n- Code blocks are highlighted again, instead of rendering inside a second code block.\n"
    filename: 2026-11-09-astro-code-blocks.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: minor\n  fumadocs-mdx:\n    type: minor\n  \"@fumadocs/satteri\":\n    type: minor\n  \"@fumadocs/local-md\":\n    type: minor\n  \"@fumadocs/astro\":\n    type: minor\n  create-fumadocs-app:\n    type: patch\n---\n\n### Path params at runtime\n\n- Refactored path params: each file of a dynamic path compiles once, and its content reads the params as `props` when rendering.\n- Refactored `remarkShow`: conditions are checked when rendering, and the `define` option and `showElement` export are removed.\n- The table of contents, structured data and processed Markdown of a page only include the `<show>` branches that show for its props, and give the values of its expressions.\n- Headings with expressions get their IDs from the rendered text, and duplicate IDs only count the headings that show.\n- Added the `props` option of `getPage()`: the content and outputs of the page follow these props, with its path params.\n- Processed Markdown and search records resolve JSX elements like the page, with the components that it imports or declares and the MDX components of its props.\n- Search records of Fumadocs MDX keep the elements of every component by default, set `filterElement` of `remarkStructure` to choose them.\n- Deprecated the `components` option of `getText()`, pass MDX components as page props.\n- Added `unstable_runtimeOutputs` in file data for custom content sources: the plugins export the outputs of a page as functions of its props. Without it, a document with `<show>` fails to compile.\n- Added `rehypeHeading`, which gives headings their IDs from code. Fumadocs MDX, `@fumadocs/astro` and local Markdown enable it.\n- Added `slugImportSource` of `remarkHeading`: a module that slugs heading IDs from the rendered text, for a custom `slug`.\n- The client loader of Fumadocs MDX takes the params of a page: `preload(path, params)`, `getComponent(path, params)` and `useContent(path, props, params)`.\n- Table of contents titles resolve MDX components from the page props.\n- Loading a page of an async collection or of `@fumadocs/astro` no longer renders its structured data: `structuredData` of the loaded page is read without rendering, `structuredData()` renders it.\n- Added the `search` target of `renderToMarkdown()`, which renders search records: `asMarkdown()` returns the target, so a component can give agents more than search indexes.\n- Added the `markdown` namespace of `replaceSource()`, for edits of processed Markdown only.\n- Search records no longer include the imports of included files.\n- The frontmatter in code of Fumadocs MDX can use imports declared after it, and keeps the other variables declared in its statement.\n- `@fumadocs/astro` supports frontmatter in code and meta files in code, like `meta.ts`.\n- Async pages of Fumadocs MDX load their content once, and render without suspending again once loaded.\n"
    filename: 2026-11-09-runtime-params.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Pierre Highlights Peer Range\n\n- Allow any 0.x version of `@pierre/highlights`.\n"
    filename: 2026-11-10-pierre-highlights-peer.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  \"@fumadocs/satteri\":\n    type: patch\n---\n\n### Steps and tab groups across `<show>`\n\n- Steps inside `<show>` are numbered with the steps around them, in the content and the table of contents.\n- A code block inside `<show>` is a tab of the tab group around it.\n- Fixed a heading like `## 1. Title` not becoming a step after a list of `###` steps.\n- Sätteri `remarkSteps` supports steps inside a step, and is faster on pages without steps.\n"
    filename: 2026-11-11-show-lists.md
    v: 0.0.0
  - content: "---\npackages:\n  create-fumadocs-app:\n    type: patch\n---\n\n### Clean template source imports\n\n- Starter templates no longer trigger unused-import lint warnings.\n"
    filename: 2026-11-10-clean-template-imports.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### OAuth redirect on static sites\n\n- `createOAuthHandler({ inline: true })` puts its script in the page, so the redirect route can be prerendered on static sites.\n"
    filename: 2026-11-10-oauth-handler-inline.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Show OAuth provider errors in the playground\n\n- When the OAuth provider refuses a flow (e.g. `access_denied`), the playground shows its error instead of returning silently.\n"
    filename: 2026-11-10-oauth-provider-errors.md
    v: 0.0.0
