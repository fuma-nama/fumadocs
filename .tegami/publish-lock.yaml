core:changelogs:
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n  create-fumadocs-app:\n    type: patch\n  fumadocs-core:\n    type: patch\n  fumadocs-mdx:\n    type: patch\n---\n\n### Setup for AI agents\n\n- CLI prompts don't wait without a terminal: a missing choice fails with the flag and its values, confirmations take their default, and existing files are kept unless `--yes` is passed.\n- The CLI fails with a clear message where it finds no supported framework, instead of setting up Next.js.\n- The CLI detects Radix UI from a plain `fumadocs-ui` dependency.\n- `init --i18n` on a static Next.js site keeps the locale in URLs and writes no proxy.\n- The duplicated slugs error names both files.\n- The macro error of Fumadocs MDX explains how to load content outside the bundler.\n- New projects include an `AGENTS.md` that links the Fumadocs docs for AI agents.\n- The CLI and `create-fumadocs-app` print plain lines instead of spinner frames without a terminal.\n- `create-fumadocs-app` names the file to set the site name and GitHub repository, and names the package after the current folder when created in `.`.\n- The `path` that a collection schema function receives is documented as absolute.\n"
    filename: 2026-11-14-agent-setup.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n  create-fumadocs-app:\n    type: patch\n---\n\n### Files for agents in every framework\n\n- `fumadocs feature llms` serves the files of `docsLlms.serve()` on every framework: `llms.txt`, `llms-full.txt`, the `llms-full.txt` of each section and `<page>.md`.\n- Page Markdown moves from `/llms.mdx/docs/<page>/content.md` to `<page>.md`, and to `/llms.mdx/<page>.md` on React Router, Waku and Next.js static export.\n- React Router and Waku serve the Markdown of a docs page to requests that prefer `text/markdown`.\n- The CLI no longer generates `getPageMarkdownUrl()`: the Markdown URL of a page is `${page.url}.md`, with the `/llms.mdx` prefix on those setups.\n- The Astro template serves the files from one endpoint.\n"
    filename: 2026-11-14-cli-llms-serve.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  fumadocs-typescript:\n    type: patch\n---\n\n### Files for agents\n\n- `llms()` adds `files()` and `serve(path)`: `llms.txt`, `llms-full.txt` and `<page>.md` files by their public path, served from one route.\n- URL directories get their own `llms-full.txt`, listed in `llms.txt`, so large docs can be read section by section.\n- `llms.txt` from `serve()` links pages to their Markdown.\n- The `filter` option leaves pages out of `full()` and the files.\n- Components without a Markdown form keep their MDX tag name in processed Markdown, also in production builds.\n- The `get_page` MCP tool accepts URLs with a hash or query, like the URLs of search results.\n- Auto type tables show the full type of each prop in Markdown.\n"
    filename: 2026-11-14-agent-markdown.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Playground translations\n\n- Translate the new playground strings in Chinese, and remove the ones the playground no longer shows.\n"
    filename: 2026-11-14-language-playground.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: patch\n---\n\n### Macro outside node_modules in Turbopack\n\n- With Turbopack, `createMDX()` no longer runs the `fumadocs-mdx/macro` transform on modules in `node_modules`, like with webpack and as the `macro.include` option documents.\n"
    filename: 2026-11-14-turbopack-macro-node-modules.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Cookie parameters\n\n- Exploded `form` cookies are sent as `color=blue&color=black` and `R=100&G=200`, instead of repeating the name as `color=color=blue&color=black` or splitting an object into separate cookies.\n- `style: cookie` is supported: values are sent as given and joined by `; `.\n- Code usages percent-encode `form` cookie values like the playground.\n"
    filename: 2026-11-14-array-cookie-explode.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Encode path parameters\n\n- The playground and code usages percent-encode path parameter values, so `#`, `?`, `/` or a space in a value no longer cuts the request URL short or sends it to another path.\n"
    filename: 2026-11-14-encode-path-parameters.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Form bodies keep their fields\n\n- `application/x-www-form-urlencoded` bodies keep `0`, `false` and empty fields in code usages, leave out unset fields instead of sending `\"null\"`, repeat the key for each array item and send objects as JSON, like `multipart/form-data`.\n- The playground and the code usages of every language send the same form body.\n"
    filename: 2026-11-14-form-urlencoded-fields.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Multipart arrays in code usages\n\n- Code usages of `multipart/form-data` bodies send one part for each item of an array, like the playground, instead of the whole array as JSON in one part.\n- Object fields are sent as compact JSON, like the playground.\n"
    filename: 2026-11-14-multipart-array-fields.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Response examples without write-only fields\n\n- Response examples generated from a schema leave out `writeOnly` properties, like the response schema and its TypeScript definitions already do.\n"
    filename: 2026-11-14-response-example-write-only.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n---\n\n### Ruby code usages\n\n- Operation pages and the playground show a Ruby code usage, with `Net::HTTP` from the standard library. Every body media type is supported, multipart bodies are sent with `set_form`.\n- `fumadocs-openapi/requests/generators/ruby` exports the generator.\n"
    filename: 2026-11-14-ruby-code-usage.md
    v: 0.0.0
