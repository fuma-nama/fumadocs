core:changelogs:
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Unions of `const` members and `string` suggest their values\n\n- In the playground, a `oneOf`/`anyOf` of `const` strings and `string` is one input that suggests the `const` members, labelled by their `title` and filtered as you type, while it still takes any string, instead of a switch between members.\n"
    filename: 2026-10-30-openapi-suggested-values.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/base-ui:\n    type: patch\n---\n\n## Use `ScrollArea.Content` for Base UI\n"
    filename: 2026-10-31-mvvynku6.md
    v: 0.0.0
