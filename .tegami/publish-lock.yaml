core:changelogs:
  - content: "---\npackages:\n  npm:fumadocs-ui:\n    type: patch\n  npm:@fumadocs/base-ui:\n    type: patch\n  npm:@fumadocs/api-docs:\n    type: patch\n  npm:@fumadocs/asyncapi:\n    type: patch\n  npm:@fumadocs/graphql:\n    type: patch\n  npm:@fumadocs/notion:\n    type: patch\n  npm:@fumadocs/story:\n    type: patch\n  npm:fumadocs-obsidian:\n    type: patch\n  npm:fumadocs-openapi:\n    type: patch\n  npm:fumadocs-preview:\n    type: patch\n  npm:fumadocs-python:\n    type: patch\n  npm:fumadocs-twoslash:\n    type: patch\n  npm:create-fumadocs-app:\n    type: patch\n---\n\n## Replace `cnfast` with `cn`\n\nInternal refactor only.\n"
    filename: 2026-09-03-cn.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/story:\n    type: minor\n---\n\n## Generate controls with the native TypeScript compiler\n\n`@fumadocs/story` no longer depends on ts-morph. Story controls are generated with the TypeScript 7 native compiler (`tsgo`), bundled as a dependency, independent of the TypeScript version of your project.\n\nTransforming a story file is about 5x faster (first file 300 ms → 30 ms, edits 20 ms → 5 ms) and uses a fraction of the memory, which mostly matters in dev where every edit regenerates controls.\n\n**Behavior changes**\n\n- Custom handlers of `@fumadocs/story/type-tree` receive TypeScript 7 API objects (`Type`, `Node`, and a `Project` exposing `project.checker`) instead of ts-morph wrappers.\n- Properties of mapped types (e.g. `Pick<Props, ...>`) and members of string literal unions may appear in a different order in the generated controls, following the native compiler.\n"
    filename: 2026-09-03-story-native-compiler.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-typescript:\n    type: minor\n---\n\n## Generate type tables with the native TypeScript compiler\n\n`fumadocs-typescript` no longer uses ts-morph. It drives the TypeScript 7 native compiler (`tsgo`) through the `typescript/unstable/sync` API, bundled as a dependency, so it works regardless of the TypeScript version of your project, including TypeScript 7 before its programmatic API is stable.\n\nOnly the documented files (and what they import) are loaded into the compiler, instead of the entire `tsconfig.json` project. On the Fumadocs docs site this makes cold generation about 5x faster (first table 500 ms → 50 ms, later tables 20 ms → 5 ms) with roughly half the memory.\n\n**Behavior changes**\n\n- `transform` and `typeSimplifier` hooks receive TypeScript 7 API objects (`Type`, `Symbol`, `Checker`, `Node`) instead of ts-morph wrappers. `this.program` is the TypeScript 7 `Project`, and `this.checker` is available.\n- The `project` option of `createGenerator()` takes the `Project` returned by `createProject()`.\n- Members of mapped types (e.g. `Pick`) and unions may be printed in a different order, following the native compiler.\n"
    filename: 2026-09-03-typescript-native-compiler.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-twoslash:\n    type: patch\n---\n\n## Bundle TypeScript for Twoslash\n\n`fumadocs-twoslash` now depends on its own TypeScript 6 and passes it to Twoslash, so the transformer keeps working in projects on TypeScript 7 (whose package no longer provides the compiler API Twoslash requires). Previously, every Twoslash code block that was not already in the types cache failed with `Cannot read properties of undefined (reading 'readFile')`.\n"
    filename: 2026-09-03-twoslash-typescript.md
    v: 0.0.0
