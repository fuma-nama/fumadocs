core:changelogs:
  - content: "---\npackages:\n  \"@fumadocs/asyncapi\":\n    type: patch\n---\n\n### Fix `imports` option of `generateFiles()`\n\nImports were written one character per line. They are now written as whole `import` lines, same as the fix for `fumadocs-openapi` in #3678.\n"
    filename: 2026-10-09-asyncapi-generate-imports.md
    v: 0.0.0
  - content: "---\npackages:\n  create-fumadocs-app:\n    type: patch\n  \"@fumadocs/cli\":\n    type: patch\n---\n\n### OG images in every template\n\n- The TanStack Start, TanStack Start SPA and React Router SPA templates generate OG images of docs pages with Takumi.\n- `--og-image next-og` warns on templates other than Next.js, instead of being ignored silently.\n- The `og` feature tells you how to prerender the images in SPA mode.\n"
    filename: 2026-10-09-template-og-images.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  fumadocs-typescript:\n    type: patch\n---\n\n### Format generated Markdown tables\n\n- Generated tables have aligned columns: the type tables of `auto-type-table`, the tables of `renderToMarkdown()` and the table rows of search records.\n- `markdownTable()` from `fumadocs-core/mdx-plugins/stringifier` creates a formatted table for your plugins.\n- `fumadocs-typescript` requires `fumadocs-core` 16.17.1.\n"
    filename: 2026-10-09-format-markdown-tables.md
    v: 0.0.0
