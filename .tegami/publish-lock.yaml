core:changelogs:
  - content: "---\npackages:\n  \"@fumadocs/astro\":\n    type: patch\n---\n\n### Managed setup\n\n- With `src/fumadocs.config.ts`, Fumadocs creates the routes of docs pages, search, `llms.txt` and the 404 page, and renders the layout.\n- Customize the UI with the `layout` and `page` options, your own React modules; `css` loads your stylesheet.\n- Replace the search engine with `useSearch()` or the dialog with `SearchDialog`, exported from the `layout` module.\n- Add `takumiPlugin()` for OG images and `openapiPlugin()` for OpenAPI pages.\n- Add `HomeLayout.astro` for your own pages.\n- Support `includeProcessedMarkdown: { output: 'function' }`: MDX components define their Markdown form with `asMarkdown()`.\n"
    filename: 2026-11-01-astro-managed-setup.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Unions of `const` members and `string` suggest their values\n\n- In the playground, a `oneOf`/`anyOf` of `const` strings and `string` is one input that suggests the `const` members, labelled by their `title` and filtered as you type, while it still takes any string, instead of a switch between members.\n"
    filename: 2026-10-30-openapi-suggested-values.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n  create-fumadocs-app:\n    type: patch\n---\n\n### Managed setup of Astro\n\n- Set up Astro with the managed setup of `@fumadocs/astro`, without routes, layouts or providers in your app.\n- On Astro, `og`, `llms`, `search`, `feedback` and `customise` extend `src/fumadocs.config.ts` and the `layout` and `page` modules.\n"
    filename: 2026-11-01-cli-astro-managed-setup.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/base-ui:\n    type: patch\n---\n\n## Use `ScrollArea.Content` for Base UI\n"
    filename: 2026-10-31-mvvynku6.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Cheaper restyles on DOM changes in layouts\n\n- The `layout:` variant matches direct children of the layout (up to three levels down in Spacious), so inserting or removing nodes no longer re-checks the whole layout for its variables.\n"
    filename: 2026-11-01-layout-variant-child.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/notion\":\n    type: patch\n---\n\n### Safer file proxy and links\n\n- `createNotionFileHandler()` caches each file once for all forms of its IDs (case, dashes).\n- `//host` and `/\\host` links and embeds are treated as other hosts, not paths of the site.\n"
    filename: 2026-11-02-notion-file-proxy.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/tailwind\":\n    type: patch\n---\n\n### Cheaper restyles in `prose` content\n\n- Table row borders check only a cell's own row, so an element that stops or starts being a last child (for example when a node is appended to the page) no longer restyles its whole subtree.\n"
    filename: 2026-11-01-prose-table-rows.md
    v: 0.0.0
