core:changelogs:
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## Fix unusable `tokenizer` search option\n\nThe search engine rejects a `language` alongside a custom `tokenizer`, since the tokenizer carries its own. Both search entry points supplied one unconditionally — `createDB`/`createDBSimple` through a destructuring default that `language: undefined` could not suppress, and `createI18nSearchAPI` by hardcoding `multilingual` after the spread — so passing `tokenizer` always threw `NO_LANGUAGE_WITH_CUSTOM_TOKENIZER` at index-build time. On i18n sources there was no call that worked at all.\n\n`language` is now omitted when a tokenizer is present (from either `tokenizer` or `components.tokenizer`), and i18n servers no longer overwrite a caller-supplied `language`. Attaching a stemmer to the default multilingual segmentation works as documented:\n\n```ts\nimport { stemmer } from '@zbsearch/stemmers/english';\n\ncreateFromSource(source, {\n  tokenizer: { language: 'multilingual', stemming: true, stemmer },\n});\n```\n"
    filename: 2026-08-06-searchtok.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/graphql:\n    type: patch\n---\n\n## Fix dropped optional arguments in playground\n\nThe playground's Variables panel exposes every argument of an operation, but the generated query only declares the required ones. Setting an optional argument used to send a variable the document never references, which servers ignore — the request looked successful but ran without it.\n\nThe query's variable declarations now follow the panel: setting an argument declares it, unsetting removes it. Sending an operation declares whatever the panel has set, so a query edited by hand can no longer drop a value. Declarations and values written by hand are never rewritten.\n\nAlso fixes the playground's form editing the example rendered on the page, which made **Reset** restore edited values instead of the original ones.\n"
    filename: 2026-08-06-gqlvars.md
    v: 0.0.0
