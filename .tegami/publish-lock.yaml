core:changelogs:
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  fumadocs-mdx:\n    type: patch\n  \"@fumadocs/satteri\":\n    type: patch\n  \"@fumadocs/astro\":\n    type: patch\n  \"@fumadocs/local-content\":\n    type: patch\n  \"@fumadocs/local-md\":\n    type: patch\n---\n\n### Path params and `<show>`\n\n- A folder or file named `[name]` makes a page for each value listed in `staticParams` of its meta file or frontmatter.\n- Each page is compiled for its params, read as `props`, and a file at a static path replaces the page of its value.\n- `<show when={...}>` shows content on a condition. Conditions on params and inlined env vars are decided before headings, TOC, search and Markdown.\n- The `define` option of Remark Show sets the values resolved at build time, like Vite's `define`, also per page.\n- Custom sources give a dynamic file `dataAt()`, and `getStaticParams()` lists its params from any storage.\n"
    filename: 2026-11-08-path-params.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### GitHub links to bracketed paths\n\n- `editOnGithub` of `DocsPage` opens files under folders like `[slug]`.\n"
    filename: 2026-11-09-encode-github-urls.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Root Folders of a Type in the Spacious Sidebar\n\n- The Spacious sidebar switches between root folders of a type (`root: 'version'`) below the section switcher, in one control.\n- A root folder that only contains folders gets a tab, linking to its first page.\n"
    filename: 2026-11-09-typed-root-tabs.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n  create-fumadocs-app:\n    type: patch\n---\n\n### ESLint on TypeScript 7\n\n- The ESLint linter installs TypeScript 6 next to TypeScript 7, so `eslint` runs on TypeScript 7 projects.\n"
    filename: 2026-11-09-eslint-typescript-7.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  fumadocs-mdx:\n    type: patch\n  \"@fumadocs/local-md\":\n    type: patch\n  \"@fumadocs/local-content\":\n    type: patch\n  \"@fumadocs/satteri\":\n    type: patch\n---\n\n### Frontmatter and Meta Files in Code\n\n- An MDX page can export `frontmatter`, merged into its frontmatter and validated by the schema. On a dynamic page, it reads the params as `props`.\n- Meta files can be modules, like `meta.ts`. The meta file of a dynamic folder can export a function of the folder's params.\n"
    filename: 2026-11-08-code-page-data.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  \"@fumadocs/satteri\":\n    type: patch\n---\n\n### Processed Markdown\n\n- Removed content, like imports, no longer leaves blank lines.\n"
    filename: 2026-11-08-markdown-blank-lines.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Rendering Inline Styles\n\n- Inline styles follow `hast-util-to-jsx-runtime` 2.3.7: property names are lowercased, custom properties keep their case, and only `url()` keeps a `;` inside parentheses.\n"
    filename: 2026-11-08-style-casing.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/satteri\":\n    type: patch\n---\n\n### Remark Show\n\n- The content of a kept `<show>` branch joins the content around it, like tab code blocks joining the tab group before the branch.\n"
    filename: 2026-11-08-show-unwrap.md
    v: 0.0.0
