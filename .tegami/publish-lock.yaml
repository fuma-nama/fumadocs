core:changelogs:
  - content: "---\npackages:\n  \"@fumadocs/astro\":\n    type: patch\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### `components` of `<Content />` on Astro\n\n- The `components` of `<Content />` render like in Astro MDX, `.astro` components included, so `createRelativeLink()` resolves relative links.\n"
    filename: 2026-11-05-astro-relative-links.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Installed components\n\n- Installed components type-check on projects without Takumi or Vite types.\n"
    filename: 2026-11-05-ui-vendored-types.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-ui:\n    type: patch\n  \"@fumadocs/base-ui\":\n    type: patch\n---\n\n### Installed components\n\n- Installed components build and type-check on projects with `verbatimModuleSyntax` or `noUncheckedIndexedAccess`.\n"
    filename: 2026-11-06-vendored-ui-types.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/cli\":\n    type: patch\n---\n\n### Fumapress sites\n\n- The CLI recognizes Fumapress sites by `press.config`. `add` and `customize` install UI as usual, and what Fumapress provides by plugins is refused.\n- `fumadocs feature` says why a feature is unavailable on your project before asking you to set up what it requires.\n"
    filename: 2026-11-06-cli-feature-reason.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Fix same-page anchors on React Router\n\n- Same-page anchors like TOC items and heading links now create history entries with their own key, so `<ScrollRestoration />` no longer overrides their scroll and restores the right position on back and forward.\n"
    filename: 2026-11-06-react-router-hash-links.md
    v: 0.0.0
