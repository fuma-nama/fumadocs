core:changelogs:
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n  \"@fumadocs/graphql\":\n    type: patch\n---\n\n### Long paths and strings in API pages\n\n- A long field path in the playground truncates its middle crumbs and keeps Unset and Remove in reach, instead of widening the form under the request panel.\n- Long unbroken strings in descriptions wrap inside property cards, security scheme cards, playground panels and field info popovers.\n"
    filename: 2026-11-16-long-strings-in-api-ui.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-mdx:\n    type: patch\n---\n\n### Smaller builds of MDX pages\n\n- The webpack/Turbopack loader no longer returns a source map of its own generated code, which cut about 1 GB of build memory on a large site.\n"
    filename: 2026-11-15-mdx-loader-source-map.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/satteri\":\n    type: patch\n---\n\n### Compile highlighted lines as HTML\n\n- `rehypeCode()` and `rehypeCodeFromHighlighter()` accept `tokens: 'html'`, which compiles the tokens of a highlighted line to HTML instead of an element per token: compiled MDX is about half the size.\n"
    filename: 2026-11-15-satteri-html-tokens.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-twoslash:\n    type: patch\n  fumadocs-typescript:\n    type: patch\n  \"@fumadocs/story\":\n    type: patch\n---\n\n### Stop TypeScript processes when idle\n\n- Twoslash, type tables and story transforms stop their TypeScript process once they have no pending work, instead of keeping it until the build ends.\n"
    filename: 2026-11-15-typescript-idle-process.md
    v: 0.0.0
