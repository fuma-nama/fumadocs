core:changelogs:
  - content: "---\npackages:\n  npm:fumadocs-ui:\n    type: patch\n  npm:@fumadocs/base-ui:\n    type: patch\n---\n\n## Keep the collapsed sidebar's controls off the page title\n\nWith the sidebar collapsed, the docs layout floats the reopen and search buttons in a fixed pill at the top-left of the page and starts the article at the same row.\nWherever the article is not centered with room to spare, every viewport below about 1280px, the pill covered the page title.\nThe article now leaves room for the pill while the sidebar is collapsed.\n"
    filename: 2026-09-21-collapsed-sidebar-panel.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-ui:\n    type: patch\n  npm:@fumadocs/base-ui:\n    type: patch\n---\n\n## AI page actions name the page by the URL the reader is on\n\nThe \"Open in ...\" prompts built the page URL from the router pathname and the origin.\nNext's `usePathname()` omits a configured `basePath`, so a site mounted under one sent assistants a URL that did not exist.\n\nThe prompt now uses the reader's current URL, without query and hash, and falls back to the pathname during server rendering.\nA new `pageUrl` prop on `ViewOptionsPopover` sets a canonical URL instead.\n"
    filename: 2026-09-21-page-actions-page-url.md
    v: 0.0.0
  - content: "---\nsubject: Subscribe with `useSyncExternalStore`\npackages:\n  npm:fumadocs-core:\n    type: patch\n  npm:fumadocs-ui:\n    type: patch\n  npm:@fumadocs/base-ui:\n    type: patch\n  npm:fumadocs-openapi:\n    type: patch\n---\n\n## Optimize Performance\n\nUse `useSyncExternalStore()` from React.\n"
    filename: 2026-09-22-use-sync-external-store.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n---\n\n## Keep TOC step numbers after an HTML re-parse\n\n`remarkSteps` marks each step heading with a numeric `data-fd-step`, and the TOC plugin only read it as a number.\nA later `rehype-raw` pass re-parses the tree from HTML, so the property came back as the canonical `dataFdStep` string and every step number silently vanished from the table of contents.\n\n`rehypeToc` now accepts both shapes, so pipelines that render raw HTML in Markdown keep their numbered TOC.\n"
    filename: 2026-09-21-toc-step-after-rehype-raw.md
    v: 0.0.0
