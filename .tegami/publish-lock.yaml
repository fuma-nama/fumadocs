core:changelogs:
  - content: "---\npackages:\n  npm:@fumadocs/api-docs:\n    type: patch\n---\n\n## Keep overlapping `type` sets when merging `allOf`\n\n`intersection` treated any difference in the `type` keyword as an impossible schema and returned `false`, so an `allOf` member using a type array (e.g. `['string', 'null']`, emitted for `nullable: true`) merged with a typed member (`type: 'string'`) produced `false` instead of `type: 'string'` — dropping every property of the schema in the Schema UI and the playground.\n\nIntersecting overlapping type sets now keeps the shared members, and only genuinely disjoint types (e.g. `['string']` with `['number']`) resolve to `false`.\n"
    filename: 2026-09-01-merge-allof-type-intersection.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/api-docs:\n    type: patch\n---\n\n## Use the explicit title of composed schemas in Schema UI\n\n`mergeAllOf` now keeps an explicit title as the display alias of the composed schema (`ChildA | ChildB`), skips titles already covered by the other side of an intersection (`DerivedConfig`, `array<NamedItem>`), and still combines the titles of untitled intersections (`Readable & Writable`).\n"
    filename: 2026-09-02-schema-ui-explicit-titles.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-core:\n    type: patch\n  npm:fumadocs-ui:\n    type: patch\n  npm:@fumadocs/base-ui:\n    type: patch\n---\n\n## Root types: version your docs with `root: \"<type>\"`\n\n`root` in `meta.json` now accepts a string, the type of root folder. Root folders of the same type under the same parent are interchangeable, which is how you keep multiple versions of the same docs in one site:\n\n```json tab=\"content/docs/v1/meta.json\"\n{\n  \"title\": \"1.0.0\",\n  \"root\": \"version\"\n}\n```\n\n```json tab=\"content/docs/v2/meta.json\"\n{\n  \"title\": \"2.0.0\",\n  \"root\": \"version\"\n}\n```\n\nThe sidebar only shows the opened version, and docs layouts render a dropdown to switch between them. Switching keeps your place: it navigates to the same page in the other version (`/docs/v1/guide` to `/docs/v2/guide`), or its index page when the page doesn't exist there.\n\n`root: true` is simply the default type, displayed as tabs. See [Versioning](https://fumadocs.dev/docs/versioning) for the guide and [Root Type](https://fumadocs.dev/docs/page-conventions#root-type) for the reference.\n\n## Tabs are grouped by root folder\n\nLayout tabs are now grouped by the root folders on the current page's path, with one dropdown per group. This changes a few behaviours of the existing `root: true` tabs:\n\n- Clicking a tab navigates to the same page in the target folder when it exists, otherwise its index page as before.\n- With nested root folders, each level gets its own dropdown instead of one flat list. Tab lists (`tabMode: 'top'` on Docs layout, `tabMode: 'navbar'` on Notebook layout) show the innermost `root: true` group, and are hidden on pages outside of any root folder.\n- `getLayoutTabs()` includes typed root folders too, so a custom `transform` also decorates them. Custom `tabs` entries bound to a page tree folder are grouped the same way, other entries are appended to the `root: true` dropdown.\n- `tabs={false}` disables the dropdowns of typed root folders as well.\n\n## `findProjection()` in `fumadocs-core/page-tree`\n\nFind the structural projection of a page in another root folder, the page at the same file path relative to the root folder:\n\n```ts\nimport { findProjection } from 'fumadocs-core/page-tree';\n\nfindProjection(v1, v2, page)?.url;\n```\n"
    filename: 2026-09-02-root-type.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@fumadocs/cli:\n    type: minor\n---\n\n## Add API Playground & Schema UI components\n\nInstall the UI of API integrations into your codebase:\n\n```npm\nnpx @fumadocs/cli add fumadocs/openapi/playground\nnpx @fumadocs/cli add fumadocs/api-docs/schema\n```\n"
    filename: 2026-09-01-cli-api-components.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumadocs-openapi:\n    type: minor\n---\n\n## Support installing the API playground via Fumadocs CLI\n\n```npm\nnpx @fumadocs/cli add fumadocs/openapi/playground\n```\n\nUse it with the `playground.provider` and `playground.render` options, see [Customise UI](https://fumadocs.dev/docs/integrations/openapi/api-page#customise-ui).\n\n## Pass full props to `schemaUI.render`\n\nIt now receives the same props as the built-in Schema UI (including `renderMarkdown` and `renderCodeblock`), so a customised Schema UI can act as a drop-in replacement:\n\n```tsx\nschemaUI: {\n  render: (props) => <Schema {...props} />,\n},\n```\n\n## New exports\n\n- OpenAPI schema types from `fumadocs-openapi` (e.g. `OperationObject`, `HttpMethods`).\n- `useRenderContext`, `useServerContext` and `useOperationContext` from `fumadocs-openapi/ui`.\n"
    filename: 2026-09-01-openapi-installable-ui.md
    v: 0.0.0
