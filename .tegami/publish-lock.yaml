core:changelogs:
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n  fumadocs-mdx:\n    type: patch\n  \"@fumadocs/satteri\":\n    type: patch\n---\n\n### Imports across Windows drives\n\n- `remarkImage` and generated `.source` files import files on another drive or a UNC path by their absolute path.\n- Generated imports of files in dot-folders are prefixed with `./`.\n\nFix [#3723](https://github.com/fuma-nama/fumadocs/issues/3723)\n"
    filename: 2026-10-19-windows-cross-drive-imports.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@fumadocs/json-schema\":\n    type: patch\n---\n\n### Recursive schemas in `mergeAllOf()`\n\n- Recursive schemas no longer overflow, e.g. subtypes that extend a parent listing them in `oneOf` merge to the parent's keywords and their own.\n- Nested schemas defined by multiple members, like a property, are combined with `allOf` and merged when read.\n- Keywords of a composed schema win over its members, including `readOnly` and `writeOnly`.\n\nFix [#3724](https://github.com/fuma-nama/fumadocs/issues/3724)\n"
    filename: 2026-10-19-json-schema-recursive-merge.md
    v: 0.0.0
