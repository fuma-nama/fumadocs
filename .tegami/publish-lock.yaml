core:changelogs:
  - content: "---\npackages:\n  fumadocs-openapi:\n    type: patch\n  \"@fumadocs/asyncapi\":\n    type: patch\n  \"@fumadocs/graphql\":\n    type: patch\n  \"@fumadocs/language\":\n    type: patch\n---\n\n### Name schema property link buttons for screen readers\n\nGive the icon-only property link button a translated label and announce when its link has been copied.\nInclude Simplified and Traditional Chinese translations for both labels.\n"
    filename: 2026-09-26-schema-link-label.md
    v: 0.0.0
  - content: "---\npackages:\n  fumadocs-core:\n    type: patch\n---\n\n### Fix infinite recursion in the MDX stringifier with `mdast-util-to-markdown@2.1.3`\n\nThe stringifier wraps every `toMarkdown` handler but dropped their `attention` and `peek` properties, which `mdast-util-to-markdown@2.1.3` relies on to serialize bold and italic text. Pages containing them overflowed the stack during build.\n"
    filename: 2026-09-27-stringifier-attention.md
    v: 0.0.0
